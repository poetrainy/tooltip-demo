<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tooltip-demo</title>
  </head>
  <body>
    <button
      id="trigger"
      type="button"
      aria-describedby="tooltip"
      popovertarget="tooltip"
    >
      Toggle the tooltip
    </button>
    <div id="tooltip" aria-role="tooltip" popover>Tooltip content</div>
    <script src="./main.js"></script>
  </body>
</html>
